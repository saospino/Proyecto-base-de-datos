<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1090" viewBox="0 0 1640 1090" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .hdr  { fill: #334155; }
    .box  { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
    .new  { fill: #ffffff; stroke: #7c3aed; stroke-width: 2.5; }
    .hnew { fill: #7c3aed; }
    .ttl  { fill: #ffffff; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .at   { font-family: Consolas, monospace; font-size: 12.5px; fill: #1f2937; }
    .pk   { font-family: Consolas, monospace; font-size: 12.5px; fill: #1d4ed8; }
    .fk   { font-family: Consolas, monospace; font-size: 12.5px; fill: #047857; }
    .pkfk { font-family: Consolas, monospace; font-size: 12.5px; fill: #7c3aed; }
    .ln   { fill: none; stroke: #334155; stroke-width: 1.5; }
    .lnv  { fill: none; stroke: #7c3aed; stroke-width: 2; }
    .m    { font-size: 12px; fill: #111827; font-weight: 600; }
    .lb   { font-size: 11.5px; fill: #64748b; font-style: italic; }
    .note { font-size: 13px; fill: #1f2937; }
  </style>
  <rect width="1640" height="1090" fill="#f8fafc"/>
  <text x="820" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">Diagrama de clases — Sistema de Biblioteca (versión Entrega 2)</text>
  <text x="820" y="64" text-anchor="middle" font-size="13" fill="#64748b">Correcciones: especialización de Socio y coautores de Libro · PK en azul, FK en verde, PK+FK en morado</text>

  <!-- ========== LÍNEAS (debajo de las cajas) ========== -->
  <!-- Autor 1 — 0..* Libro -->
  <path class="ln" d="M250,160 H320"/>
  <text class="m" x="256" y="153">1</text><text class="m" x="290" y="153">0..*</text>
  <text class="lb" x="259" y="178">principal</text>
  <!-- Libro ◆ Ejemplar (composición) -->
  <path class="lnv" d="M604,150 H660"/>
  <polygon points="590,150 597,144 604,150 597,156" fill="#7c3aed"/>
  <text class="m" x="606" y="143">1</text><text class="m" x="640" y="143">1..*</text>
  <text class="lb" x="598" y="172">tiene</text>
  <!-- Libro 1 — 0..* Reserva -->
  <path class="ln" d="M455,258 V430"/>
  <text class="m" x="462" y="275">1</text><text class="m" x="462" y="422">0..*</text>
  <text class="lb" x="462" y="350">es reservado en</text>
  <!-- Socio 1 — 0..* Reserva -->
  <path class="ln" d="M1000,205 H930 V480 H590"/>
  <text class="m" x="984" y="198">1</text><text class="m" x="596" y="473">0..*</text>
  <text class="lb" x="700" y="473">solicita</text>
  <!-- Ejemplar 1 — 0..* Préstamo -->
  <path class="ln" d="M780,201 V680"/>
  <text class="m" x="787" y="218">1</text><text class="m" x="787" y="672">0..*</text>
  <text class="lb" x="787" y="600">prestado en</text>
  <!-- Socio 1 — 0..* Préstamo -->
  <path class="ln" d="M1000,175 H950 V730 H920"/>
  <text class="m" x="984" y="168">1</text><text class="m" x="924" y="722">0..*</text>
  <text class="lb" x="957" y="640">recibe</text>
  <text class="lb" x="957" y="655">(máx. 5 activos)</text>
  <!-- Bibliotecario 1 — 0..* Préstamo -->
  <path class="ln" d="M1475,182 V830 H920"/>
  <text class="m" x="1482" y="200">1</text><text class="m" x="924" y="822">0..*</text>
  <text class="lb" x="1200" y="822">atiende</text>
  <!-- Préstamo 1 — 0..2 Multa -->
  <path class="ln" d="M620,770 H280"/>
  <text class="m" x="600" y="763">1</text><text class="m" x="286" y="763">0..2</text>
  <text class="lb" x="380" y="763">genera (una por motivo)</text>

  <!-- Generalización Socio <- Estudiante / Docente -->
  <path class="lnv" d="M1130,244 V330 M1070,330 H1330 M1070,330 V420 M1330,330 V420"/>
  <polygon points="1130,220 1118,244 1142,244" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="1130" cy="290" r="13" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1130" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">d</text>
  <text x="1152" y="285" font-size="12.5" fill="#7c3aed" font-weight="600">{disjunta, total}</text>
  <text x="1152" y="301" font-size="11.5" fill="#7c3aed">discriminante: tipo_socio</text>

  <!-- ========== CLASES ========== -->
  <!-- Autor -->
  <rect class="box" x="40" y="100" width="210" height="101" rx="3"/>
  <rect class="hdr" x="40" y="100" width="210" height="32" rx="3"/>
  <text class="ttl" x="145" y="121">Autor</text>
  <text class="pk" x="50" y="153">id_autor: int «PK»</text>
  <text class="at" x="50" y="172">nombre: varchar(150)</text>
  <text class="at" x="50" y="191">nacionalidad: varchar(60)</text>

  <!-- Libro -->
  <rect class="box" x="320" y="100" width="270" height="158" rx="3"/>
  <rect class="hdr" x="320" y="100" width="270" height="32" rx="3"/>
  <text class="ttl" x="455" y="121">Libro</text>
  <text class="pk" x="330" y="153">id_libro: int «PK»</text>
  <text class="fk" x="330" y="172">id_autor_principal: int «FK»</text>
  <text class="at" x="330" y="191">titulo: varchar(200)</text>
  <text class="at" x="330" y="210">genero: varchar(60)</text>
  <text class="at" x="330" y="229">editorial: varchar(100)</text>
  <text class="at" x="330" y="248">anio_publicacion: smallint</text>

  <!-- Ejemplar (débil) -->
  <rect class="box" x="660" y="100" width="240" height="101" rx="3" stroke-dasharray="0"/>
  <rect class="hdr" x="660" y="100" width="240" height="32" rx="3"/>
  <text class="ttl" x="780" y="121">Ejemplar «débil»</text>
  <text class="pkfk" x="670" y="153">id_libro: int «PK, FK»</text>
  <text class="pk" x="670" y="172">num_ejemplar: smallint «PK»</text>
  <text class="at" x="670" y="191">estado: {disponible, prestado,…}</text>

  <!-- Socio (superclase) -->
  <rect class="new" x="1000" y="100" width="260" height="120" rx="3"/>
  <rect class="hnew" x="1000" y="100" width="260" height="32" rx="3"/>
  <text class="ttl" x="1130" y="121">Socio «superclase»</text>
  <text class="pk" x="1010" y="153">id_socio: int «PK»</text>
  <text class="at" x="1010" y="172">nombre: varchar(150)</text>
  <text class="at" x="1010" y="191">tipo_socio: {estudiante, docente}</text>
  <text class="at" x="1010" y="210">codigo_institucional «UNIQUE»</text>

  <!-- Bibliotecario -->
  <rect class="box" x="1360" y="100" width="230" height="82" rx="3"/>
  <rect class="hdr" x="1360" y="100" width="230" height="32" rx="3"/>
  <text class="ttl" x="1475" y="121">Bibliotecario</text>
  <text class="pk" x="1370" y="153">id_bibliotecario: int «PK»</text>
  <text class="at" x="1370" y="172">nombre: varchar(150)</text>

  <!-- Estudiante -->
  <rect class="new" x="960" y="420" width="220" height="101" rx="3"/>
  <rect class="hnew" x="960" y="420" width="220" height="32" rx="3"/>
  <text class="ttl" x="1070" y="441">Estudiante</text>
  <text class="pkfk" x="970" y="473">id_socio: int «PK, FK»</text>
  <text class="at" x="970" y="492">programa: varchar(100)</text>
  <text class="at" x="970" y="511">semestre: smallint (1–12)</text>

  <!-- Docente -->
  <rect class="new" x="1220" y="420" width="220" height="101" rx="3"/>
  <rect class="hnew" x="1220" y="420" width="220" height="32" rx="3"/>
  <text class="ttl" x="1330" y="441">Docente</text>
  <text class="pkfk" x="1230" y="473">id_socio: int «PK, FK»</text>
  <text class="at" x="1230" y="492">departamento: varchar(100)</text>
  <text class="at" x="1230" y="511">tipo_vinculacion: {planta,…}</text>

  <!-- Reserva -->
  <rect class="box" x="320" y="430" width="270" height="120" rx="3"/>
  <rect class="hdr" x="320" y="430" width="270" height="32" rx="3"/>
  <text class="ttl" x="455" y="451">Reserva</text>
  <text class="pk" x="330" y="483">id_reserva: int «PK»</text>
  <text class="fk" x="330" y="502">id_libro: int «FK»</text>
  <text class="fk" x="330" y="521">id_socio: int «FK»</text>
  <text class="at" x="330" y="540">fecha_reserva: date · estado</text>

  <!-- Préstamo -->
  <rect class="box" x="620" y="680" width="300" height="196" rx="3"/>
  <rect class="hdr" x="620" y="680" width="300" height="32" rx="3" style="fill:#b91c1c"/>
  <text class="ttl" x="770" y="701">Préstamo</text>
  <text class="pk" x="630" y="733">id_prestamo: int «PK»</text>
  <text class="fk" x="630" y="752">id_libro, num_ejemplar «FK»</text>
  <text class="fk" x="630" y="771">id_socio: int «FK»</text>
  <text class="fk" x="630" y="790">id_bibliotecario: int «FK»</text>
  <text class="at" x="630" y="809">fecha_prestamo: date</text>
  <text class="at" x="630" y="828">fecha_devolucion_esperada: date</text>
  <text class="at" x="630" y="847">fecha_devolucion_real: date</text>
  <text class="at" x="630" y="866">  (NULL = préstamo activo)</text>

  <!-- Multa -->
  <rect class="box" x="40" y="680" width="240" height="158" rx="3"/>
  <rect class="hdr" x="40" y="680" width="240" height="32" rx="3"/>
  <text class="ttl" x="160" y="701">Multa</text>
  <text class="pk" x="50" y="733">id_multa: int «PK»</text>
  <text class="fk" x="50" y="752">id_prestamo: int «FK»</text>
  <text class="at" x="50" y="771">monto: numeric(10,2)</text>
  <text class="at" x="50" y="790">motivo: {atraso, dano}</text>
  <text class="at" x="50" y="809">estado: {pendiente, pagada}</text>
  <text class="at" x="50" y="828">fecha_generacion, fecha_pago</text>

  <!-- Autor 1 — 0..* LibroCoautor 0..* — 1 Libro (M:N de coautores) -->
  <path class="lnv" d="M145,201 V310"/>
  <text class="m" x="152" y="218">1</text><text class="m" x="152" y="304">0..*</text>
  <text class="lb" x="152" y="262">es coautor</text>
  <path class="lnv" d="M320,230 H295 V360 H270"/>
  <text class="m" x="304" y="223">1</text><text class="m" x="274" y="353">0..*</text>
  <!-- LibroCoautor -->
  <rect class="new" x="40" y="310" width="230" height="101" rx="3"/>
  <rect class="hnew" x="40" y="310" width="230" height="32" rx="3"/>
  <text class="ttl" x="155" y="331">LibroCoautor</text>
  <text class="pkfk" x="50" y="363">id_libro: int «PK, FK»</text>
  <text class="pkfk" x="50" y="382">id_autor: int «PK, FK»</text>
  <text class="at" x="50" y="401">orden: smallint (≥ 2) «UQ»</text>

  <!-- Reglas de negocio -->
  <rect x="40" y="910" width="1560" height="160" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="820" y="938" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Reglas de negocio</text>
  <text class="note" x="70" y="968">• Cada libro tiene exactamente un autor principal y cero o más coautores (orden de firma 2, 3…).</text>
  <text class="note" x="70" y="992">• Socio se especializa en Estudiante o Docente: disjunta y total. Ambos tienen las mismas reglas de préstamo.</text>
  <text class="note" x="70" y="1016">• Un ejemplar no puede estar prestado dos veces a la vez; solo ejemplares «disponible» pasan a «prestado».</text>
  <text class="note" x="70" y="1040">• Una multa por motivo (atraso o daño) por préstamo.</text>
  <text class="note" x="850" y="968">• Máximo 5 préstamos activos simultáneos por socio.</text>
  <text class="note" x="850" y="992">• Un socio con multas pendientes no puede recibir préstamos nuevos.</text>
  <text class="note" x="850" y="1016">• Solo se reserva un libro sin ejemplares disponibles.</text>
  <text class="note" x="850" y="1040">• Un socio no tiene dos reservas vigentes del mismo libro.</text>
</svg>
